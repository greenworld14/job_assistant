<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Tracker · Job Apply Assistant</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    .page { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .top .brand { display: flex; align-items: center; gap: 10px; }
    .top img { width: 32px; height: 32px; }
    .top nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .stats { grid-template-columns: repeat(5, 1fr); }
    .goal { display: flex; align-items: center; gap: 12px; }
    .goal .progress { flex: 1; }
    .goal-txt { font-size: 13px; white-space: nowrap; }
    .filters { display: grid; grid-template-columns: 2fr repeat(3, 1fr) auto auto; gap: 8px; align-items: end; }
    .quick { display: flex; gap: 4px; flex-wrap: wrap; }
    .quick .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
    td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: var(--surface-2); }
    td input, td select { padding: 4px 6px; border-color: transparent; background: transparent; }
    td input:hover, td select:hover { border-color: var(--border-strong); }
    td.when { white-space: nowrap; font-variant-numeric: tabular-nums; }
    td.acts { white-space: nowrap; text-align: right; }
    .st-Applied { color: var(--accent); }
    .st-Interview { color: #7c3aed; }
    .st-Offer { color: var(--good); }
    .st-Rejected { color: var(--bad); }
    .st-Saved { color: var(--muted); }
    .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
    .add-row { display: grid; grid-template-columns: 1.3fr 1.3fr 2fr 1fr 1fr auto; gap: 8px; align-items: end; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .bar .right { display: flex; gap: 6px; flex-wrap: wrap; }
    @media (max-width: 860px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .filters, .add-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 520px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .filters, .add-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="brand"><img src="icons/icon48.png" alt=""><div><h1>Application Tracker</h1><div class="muted small">Every job you've applied to, stored only in this browser</div></div></div>
      <nav>
        <button class="btn" id="undoLast">↶ Undo last count</button>
        <a class="btn" href="options.html">👤 Profile</a>
        <a class="btn ghost" href="options.html#settings">Settings</a>
      </nav>
    </div>

    <section class="stats">
      <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total applied</div></div>
      <div class="stat"><div class="n" id="sToday">0</div><div class="l">Today</div></div>
      <div class="stat"><div class="n" id="sWeek">0</div><div class="l">This week</div></div>
      <div class="stat"><div class="n" id="sMonth">0</div><div class="l">This month</div></div>
      <div class="stat"><div class="n" id="sSaved">0</div><div class="l">Saved</div></div>
    </section>

    <section class="card goal" id="goalBox">
      <span class="goal-txt">Daily goal</span>
      <div class="progress" id="goalBar"><span style="width:0"></span></div>
      <span class="goal-txt" id="goalText"></span>
      <input type="number" id="goalInput" min="0" max="200" style="width:80px" title="Daily goal (0 = off)">
    </section>

    <section class="card">
      <div class="filters">
        <label class="field">Search<input id="q" placeholder="Company, title or URL"></label>
        <label class="field">Status<select id="fStatus"><option value="">All statuses</option></select></label>
        <label class="field">From<input id="fFrom" type="date"></label>
        <label class="field">To<input id="fTo" type="date"></label>
        <label class="field">Site<select id="fSite"><option value="">All sites</option></select></label>
        <button class="btn ghost" id="clearFilters">Clear</button>
      </div>
      <div class="quick" style="margin-top:10px">
        <button class="btn sm" data-range="today">Today</button>
        <button class="btn sm" data-range="week">This week</button>
        <button class="btn sm" data-range="month">This month</button>
        <button class="btn sm" data-range="all">All time</button>
      </div>
    </section>

    <section class="card">
      <div class="bar">
        <div><b id="countLabel">0 entries</b></div>
        <div class="right">
          <button class="btn sm" id="toggleAdd">+ Add manually</button>
          <button class="btn sm" id="exportCsv">⤓ Export CSV</button>
          <button class="btn sm danger" id="resetBtn">Reset counter</button>
        </div>
      </div>
      <form class="add-row hidden" id="addForm">
        <label class="field">Company<input name="company" required></label>
        <label class="field">Job title<input name="title" required></label>
        <label class="field">URL<input name="url" type="url" placeholder="https://…"></label>
        <label class="field">Date<input name="date" type="date"></label>
        <label class="field">Status<select name="status"></select></label>
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="appliedAt">Date ▾</th>
              <th data-sort="company">Company</th>
              <th data-sort="title">Job title</th>
              <th data-sort="site">Site</th>
              <th data-sort="status">Status</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty hidden" id="empty"></div>
      </div>
    </section>
  </div>
  <script src="shared.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
